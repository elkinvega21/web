# Adventure Retail ERP — Entorno de desarrollo local
# Para producción se usan servicios administrados (Neon / Vercel / ECS).

services:
  postgres:
    image: postgres:16-alpine
    container_name: adventure-postgres
    environment:
      POSTGRES_DB: adventure_retail
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init.sh corre en el arranque y aplica los .sql de las dos carpetas en orden.
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d adventure_retail"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: adventure-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/adventure_retail
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-adventure-retail-dev-secret-change-me-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: adventure-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
