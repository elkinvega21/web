services:
  - type: web
    name: adventure-retail-backend
    env: docker
    dockerfilePath: docker/backend/Dockerfile
    dockerContext: .
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: ADMIN_EMAIL
        value: admin@adventureretail.com
      - key: ADMIN_PASSWORD
        value: Admin2025!
      - key: SPRING_PROFILES_ACTIVE
        value: dev
