server:
  port: ${PORT:8080}

spring:
  application:
    name: adventure-retail-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:adventure-retail-dev-secret-change-me-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    email: ${ADMIN_EMAIL:admin@adventureretail.com}
    password: ${ADMIN_PASSWORD:Admin2025!}
    name: ${ADMIN_NAME:Laura Restrepo}
